{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card dark-card shadow-lg p-4">
            <h3 class="text-center text-warning mb-4">Create Account</h3>

            {% if error %}
                <div class="alert alert-danger text-center">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-light">Username</label>
                    <input type="text" name="username" class="form-control dark-input" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light">Password</label>
                    <input type="password" name="password" class="form-control dark-input" required>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold">
                    Register
                </button>
            </form>

            <p class="text-center text-muted mt-3">
                Already have an account?
                <a href="{{ url_for('login') }}" class="text-info">Login</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
